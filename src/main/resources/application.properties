spring.application.name=ScienceCentre
spring.datasource.url=jdbc:mysql://localhost:3306/science_project
spring.datasource.username=root
spring.datasource.password=01082003

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ================= JWT =================
jwt.secret=myVeryLongAndSecureSecretKeyThatIsAtLeast32Chars!
jwt.expiration=86400000

# =============== SECURITY ===============
security.permitUrls=/api/auth/login,/api/auth/admin-exists,/api/lookups/**
security.adminUrls=/api/admin/**
security.adminRole=ADMIN


# =============== CORS ===================
security.allowedOrigins=http://localhost:3000,http://localhost:3006
security.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
security.allowedHeaders=Authorization,Content-Type
